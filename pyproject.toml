[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntax_symphony"
version = "0.2.0"
description = "Efficient grammar-based fuzzer."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Stanimir Iglev", email = "iglev.stanimir@gmail.com" }]
maintainers = [{ name = "Stanimir Iglev", email = "iglev.stanimir@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["fuzzer", "fuzzing", "testing", "grammar", "grammars"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
]
dependencies = ["schema >= 0.7.7"]

[dependency-groups]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8", "ruff>=0.5", "twine>=5.0"]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/StanimirIglev/syntax-symphony"
Documentation = "https://github.com/StanimirIglev/syntax-symphony/blob/master/README.md"
Repository = "https://github.com/StanimirIglev/syntax-symphony"
Changelog = "https://github.com/StanimirIglev/syntax-symphony/blob/master/CHANGELOG.md"

[project.scripts]
ssfuzz = "syntax_symphony.cli:ssfuzz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "T20", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"src/syntax_symphony/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["syntax_symphony"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "schema.*"
ignore_missing_imports = true
